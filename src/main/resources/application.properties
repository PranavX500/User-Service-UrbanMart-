# ============================
# APPLICATION
# ============================
spring.application.name=${SPRING_APPLICATION_NAME:USER-SERVICE}
server.port=${SERVER_PORT:8088}

# ============================
# SPRING MVC
# ============================
spring.mvc.pathmatch.matching-strategy=${MVC_MATCHING_STRATEGY:ant_path_matcher}

# ============================
# JWT
# ============================
jwt.secretKey=${JWT_SECRET_KEY}

# ============================
# DATABASE
# ============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ============================
# JPA / HIBERNATE
# ============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}



# ============================
# KAFKA
# ============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.consumer.properties.spring.json.trusted.packages=${KAFKA_TRUSTED_PACKAGES:*}

spring.kafka.consumer.key-deserializer=${KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}

spring.kafka.consumer.value-deserializer=${KAFKA_CONSUMER_VALUE_DESERIALIZER:org.springframework.kafka.support.serializer.JsonDeserializer}

spring.kafka.producer.key-serializer=${KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}

spring.kafka.producer.value-serializer=${KAFKA_PRODUCER_VALUE_SERIALIZER:org.springframework.kafka.support.serializer.JsonSerializer}

# ============================
# ERROR HANDLING
# ============================
server.error.include-message=${ERROR_INCLUDE_MESSAGE:always}
server.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:on_param}
server.error.include-exception=${ERROR_INCLUDE_EXCEPTION:true}
server.error.whitelabel.enabled=${ERROR_WHITELABEL_ENABLED:false}

# ============================
# LOGGING
# ============================
logging.level.com.zaxxer.hikari=${HIKARI_LOG_LEVEL:DEBUG}
logging.level.org.springframework.jdbc=${SPRING_JDBC_LOG_LEVEL:DEBUG}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:DEBUG}
