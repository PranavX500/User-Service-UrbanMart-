spring.application.name=USER-SERVICE
server.port=8088

# ============================
# SPRING MVC
# ============================
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ============================
# JWT
# ============================
jwt.secretKey=fewfbewufh@euofew$jdfwnf&&&*jnkjfnekjw#fbhjewbfhewfbhj98989@@

# ============================
# DATABASE (LOCAL)
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/User_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pranav@2005

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================
# JPA / HIBERNATE
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true



# ============================
# KAFKA (LOCAL)
# ============================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ============================
# ERROR HANDLING
# ============================
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=true
server.error.whitelabel.enabled=false

# ============================
# LOGGING
# ============================
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG
logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG



management.endpoints.web.exposure.include=*
management.endpoint.prometheus.access=unrestricted
management.prometheus.metrics.export.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================
# EUREKA INSTANCE
# ============================
eureka.instance.prefer-ip-address=false

